<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ODA original geometry visual review</title><style>body{margin:0;background:#f7f3ea;color:#173e35;font:14px system-ui}main{max-width:700px;margin:30px auto;text-align:center}canvas{display:block;width:100%;height:480px;touch-action:pan-y}button{min-width:44px;min-height:44px;margin:5px;padding:10px;background:#f7f3ea;border:1px solid #173e3540;border-radius:30px;color:#173e35}p{line-height:1.6;padding:0 20px}</style><main><h1>Original ODA 3D tree · visual review</h1><canvas tabindex="0" aria-label="Original procedural tree geometry, use arrows to turn"></canvas><div><button id="left">Turn left</button><button id="right">Turn right</button><button id="reset">Reset</button></div><p>This is an ungated geometry studio for visual review. The production component separately applies WebGL, reduced-motion, device and measured frame-time fallbacks. This view is not a performance pass.</p></main><script type="module">
import * as THREE from 'three';import{createTreeModel}from'/src/components/momentum/treeGeometry.ts';
const canvas=document.querySelector('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(1);renderer.setSize(700,480,false);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;
const scene=new THREE.Scene();const model=createTreeModel(60);scene.add(model.group);scene.add(new THREE.HemisphereLight('#fff9e9','#4b5340',2.3));const sun=new THREE.DirectionalLight('#fff4d6',3);sun.position.set(-4,7,5);scene.add(sun);const fill=new THREE.DirectionalLight('#eef1de',1);fill.position.set(3,4,-4);scene.add(fill);const camera=new THREE.PerspectiveCamera(38,700/480,.1,30);const bounds=new THREE.Box3().setFromObject(model.group);const height=Math.max(5.2,bounds.max.y);const radius=Math.max(2.45,Math.abs(bounds.min.x),Math.abs(bounds.max.x),Math.abs(bounds.min.z),Math.abs(bounds.max.z));const target=new THREE.Vector3(0,height/2,0);let angle=0;
function draw(){const distance=Math.max(height/2/Math.tan(19*Math.PI/180),radius/(Math.tan(19*Math.PI/180)*camera.aspect))*1.24;camera.position.set(Math.sin(angle)*distance,target.y+.075*distance,Math.cos(angle)*distance);camera.lookAt(target);renderer.render(scene,camera);canvas.dataset.yaw=angle.toFixed(4)}
document.querySelector('#left').onclick=()=>{angle-=Math.PI/12;draw()};document.querySelector('#right').onclick=()=>{angle+=Math.PI/12;draw()};document.querySelector('#reset').onclick=()=>{angle=0;draw()};canvas.onkeydown=e=>{if(e.key==='ArrowLeft'){angle-=Math.PI/12;e.preventDefault();draw()}if(e.key==='ArrowRight'){angle+=Math.PI/12;e.preventDefault();draw()}};draw();window.modelReview={leaves:model.leaves,triangles:renderer.info.render.triangles,drawCalls:renderer.info.render.calls};
</script></html>
